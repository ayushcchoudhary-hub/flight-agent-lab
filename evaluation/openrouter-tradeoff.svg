<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Repeated OpenRouter validation: latency versus observed cost</title><desc id="chart-desc">Lower and farther left is better. DeepSeek V4.1 Flash low passed the complete 3-repeat plan.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#17243a}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#52627a}.axis{font-size:12px;fill:#617089}.grid{stroke:#dfe5ee;stroke-width:1}.eligible{stroke-width:3}.failed{fill:#fff;stroke-width:3}.label{font-size:12px;font-weight:650}.note{font-size:12px;fill:#52627a}</style><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><text class="title" x="92" y="36">Repeated validation: speed versus observed cost</text><text class="sub" x="92" y="61">Lower left is better. Filled dots passed all 3 repeats; hollow dots had at least one failed attempt.</text><line class="grid" x1="92" x2="92" y1="82" y2="448"/><text class="axis" x="92" y="472" text-anchor="middle">0s</text><line class="grid" x1="368" x2="368" y1="82" y2="448"/><text class="axis" x="368" y="472" text-anchor="middle">1s</text><line class="grid" x1="644" x2="644" y1="82" y2="448"/><text class="axis" x="644" y="472" text-anchor="middle">2s</text><line class="grid" x1="920" x2="920" y1="82" y2="448"/><text class="axis" x="920" y="472" text-anchor="middle">3s</text><line class="grid" x1="92" x2="920" y1="411.4" y2="411.4"/><text class="axis" x="80" y="415.4" text-anchor="end">$0.0001</text><line class="grid" x1="92" x2="920" y1="228.39999999999998" y2="228.39999999999998"/><text class="axis" x="80" y="232.39999999999998" text-anchor="end">$0.001</text><line class="grid" x1="92" x2="920" y1="45.39999999999997" y2="45.39999999999997"/><text class="axis" x="80" y="49.39999999999997" text-anchor="end">$0.01</text><text class="axis" x="506" y="498" text-anchor="middle">Median elapsed time per scenario →</text><text class="axis" transform="translate(22 265) rotate(-90)" text-anchor="middle">Observed cost per scenario, log scale →</text><circle class="failed" cx="581.9000000000001" cy="128.70173741031968" r="8" fill="#ffffff" stroke="#24805f"><title>Terra medium: 43/45 passed, 1.77 seconds, $0.00351 per scenario</title></circle><text class="label" x="593.9000000000001" y="116.70173741031968">Terra medium</text><circle class="eligible" cx="584.384" cy="397.33930054835105" r="8" fill="#5d55c8" stroke="#5d55c8"><title>DeepSeek V4.1 Flash low: 45/45 passed, 1.78 seconds, $0.00012 per scenario</title></circle><text class="label" x="596.384" y="421.33930054835105">DeepSeek V4.1 Flash low</text><text class="note" x="92" y="530">3 attempts per scenario. OpenRouter serving path. Missing-cost failures are omitted from this plot and remain in the table.</text></svg>
