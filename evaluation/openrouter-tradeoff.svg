<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">OpenRouter model screen: latency versus observed cost</title><desc id="chart-desc">Lower and farther left is better. DeepSeek low, GLM high and Terra medium passed all fifteen scenarios. DeepSeek low was the lowest-cost passing candidate, while GLM high was slightly faster.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#17243a}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#52627a}.axis{font-size:12px;fill:#617089}.grid{stroke:#dfe5ee;stroke-width:1}.eligible{stroke-width:3}.failed{fill:#fff;stroke-width:3}.label{font-size:12px;font-weight:650}.note{font-size:12px;fill:#52627a}</style><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><text class="title" x="92" y="36">OpenRouter screen: speed versus observed cost</text><text class="sub" x="92" y="61">Lower left is better. Filled dots passed all 15 cases; hollow dots failed or stopped at the smoke gate.</text><line class="grid" x1="92" x2="92" y1="82" y2="448"/><text class="axis" x="92" y="472" text-anchor="middle">0s</text><line class="grid" x1="257.6" x2="257.6" y1="82" y2="448"/><text class="axis" x="257.6" y="472" text-anchor="middle">1s</text><line class="grid" x1="423.20000000000005" x2="423.20000000000005" y1="82" y2="448"/><text class="axis" x="423.20000000000005" y="472" text-anchor="middle">2s</text><line class="grid" x1="588.8" x2="588.8" y1="82" y2="448"/><text class="axis" x="588.8" y="472" text-anchor="middle">3s</text><line class="grid" x1="754.4000000000001" x2="754.4000000000001" y1="82" y2="448"/><text class="axis" x="754.4000000000001" y="472" text-anchor="middle">4s</text><line class="grid" x1="920" x2="920" y1="82" y2="448"/><text class="axis" x="920" y="472" text-anchor="middle">5s</text><line class="grid" x1="92" x2="920" y1="411.4" y2="411.4"/><text class="axis" x="80" y="415.4" text-anchor="end">$0.0001</text><line class="grid" x1="92" x2="920" y1="228.39999999999998" y2="228.39999999999998"/><text class="axis" x="80" y="232.39999999999998" text-anchor="end">$0.001</text><line class="grid" x1="92" x2="920" y1="45.39999999999997" y2="45.39999999999997"/><text class="axis" x="80" y="49.39999999999997" text-anchor="end">$0.01</text><text class="axis" x="506" y="498" text-anchor="middle">Median elapsed time per scenario →</text><text class="axis" transform="translate(22 265) rotate(-90)" text-anchor="middle">Observed cost per scenario, log scale →</text><circle class="eligible" cx="488.1152" cy="122.75250811158747" r="8" fill="#24805f" stroke="#24805f"><title>Terra medium: 15/15 passed, 2.39 seconds, $0.00378 per scenario</title></circle><text class="label" x="500.1152" y="110.75250811158747">Terra medium</text><circle class="eligible" cx="332.6168" cy="363.3862990470014" r="8" fill="#5d55c8" stroke="#5d55c8"><title>DeepSeek V4.1 Flash low: 15/15 passed, 1.45 seconds, $0.00018 per scenario</title></circle><text class="label" x="344.6168" y="387.3862990470014">DeepSeek V4.1 Flash low</text><circle class="failed" cx="747.6104" cy="283.21122108208704" r="8" fill="#ffffff" stroke="#5d55c8"><title>DeepSeek V4.1 Flash high: 3/4 passed, 3.96 seconds, $0.00050 per scenario</title></circle><text class="label" x="759.6104" y="271.21122108208704">DeepSeek V4.1 Flash high</text><circle class="failed" cx="388.7552" cy="303.21208471143296" r="8" fill="#ffffff" stroke="#168b8f"><title>Qwen3.6 35B A3B default: 14/15 passed, 1.79 seconds, $0.00039 per scenario</title></circle><text class="label" x="400.7552" y="327.21208471143296">Qwen3.6 35B A3B default</text><circle class="eligible" cx="324.1712" cy="234.7323512541168" r="8" fill="#963b85" stroke="#963b85"><title>GLM 5.3 high: 15/15 passed, 1.40 seconds, $0.00092 per scenario</title></circle><text class="label" x="336.1712" y="220.7323512541168">GLM 5.3 high</text><text class="note" x="92" y="530">One attempt per scenario. OpenRouter serving path. Missing-cost failures are omitted from this plot and remain in the table.</text></svg>
